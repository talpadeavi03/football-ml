name: football-ml-ci-cd

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'ml/models/**'
      - 'infra/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Lint & basic import test
        run: |
          python -c "import fastapi, ultralytics, cv2"

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t football-ml-api:latest backend/

      - name: Tag model release
        run: |
          echo "Model version validated and Docker image built."
